# Deploy backend ไป Cloud Run
#   push dev  -> GitHub Environment "dev"  -> campus-api-dev
#   push main -> GitHub Environment "prod" -> campus-api (ตั้ง required reviewer ให้ prod)
#
# ขั้นตอน: WIF auth -> build/push image :<git-sha> -> migration job -> deploy revision
#          แบบยังไม่รับ traffic -> smoke test /healthz บน tag URL -> ย้าย traffic 100%
# ถ้า migration หรือ smoke test ล้ม pipeline หยุดและ revision เดิมยังรับ traffic อยู่
name: backend-cd

on:
  push:
    branches: [main, dev]
    paths: ["backend/**", ".github/workflows/backend-cd.yml"]
  workflow_dispatch:
    inputs:
      traffic_percent:
        description: "Traffic to the new revision (100 = full rollout, e.g. 10 = canary; promote later with infra/gcp/ops.sh promote)"
        required: false
        default: "100"

permissions:
  contents: read
  id-token: write # ให้ GitHub ออก OIDC token สำหรับ Workload Identity Federation

concurrency:
  group: backend-cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    # ปิดไว้จนกว่าจะตั้งค่า GCP เสร็จ: ตั้ง repository variable DEPLOY_ENABLED=true เพื่อเปิด
    # และ workflow_dispatch จาก branch อื่นต้องไม่ถูก deploy ไป dev
    if: vars.DEPLOY_ENABLED == 'true' && (github.ref_name == 'main' || github.ref_name == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.SERVICE_NAME }}
      MIGRATE_JOB: ${{ vars.MIGRATE_JOB }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/campus/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF, no JSON key)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Configure gcloud
        run: |
          gcloud config set project "${{ vars.GCP_PROJECT_ID }}"
          gcloud config set run/region "$REGION"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          docker build --target production -t "$IMAGE" backend
          docker push "$IMAGE"

      - name: Run database migration (Cloud Run Job)
        run: |
          gcloud run jobs update "$MIGRATE_JOB" --image "$IMAGE"
          gcloud run jobs execute "$MIGRATE_JOB" --wait

      - name: Deploy new revision without traffic
        id: deploy
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          # อัปเดตแค่ image: env, secrets, network, service account คงค่าจากตอน setup
          gcloud run deploy "$SERVICE" --image "$IMAGE" --no-traffic --tag "$TAG" --allow-unauthenticated --quiet
          REVISION=$(gcloud run services describe "$SERVICE" --format='value(status.latestCreatedRevisionName)')
          SERVICE_URL=$(gcloud run services describe "$SERVICE" --format='value(status.url)')
          # ดึง Tag URL จริงจาก Cloud Run โดยตรง (ใช้ JSON + jq)
          TAG_URL=$(gcloud run services describe "$SERVICE" --format=json \
            | jq -r --arg t "$TAG" '.status.traffic[] | select(.tag == $t) | .url')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "tag_url=$TAG_URL" >> "$GITHUB_OUTPUT"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test new revision
        run: |
          TAG_URL="${{ steps.deploy.outputs.tag_url }}"
          SERVICE_URL="${{ steps.deploy.outputs.service_url }}"
          REVISION="${{ steps.deploy.outputs.revision }}"

          if [ -z "$TAG_URL" ] || [ "$TAG_URL" = "null" ]; then
            echo "::error::Cloud Run did not return a URL for tag ${{ steps.deploy.outputs.tag }}"
            exit 1
          fi

          # ─── ตรวจสอบ revision status ก่อน ─────────────────────────
          echo "Checking revision $REVISION readiness..."
          CONDITION="Unknown"
          for i in $(seq 1 12); do
            CONDITION=$(gcloud run revisions describe "$REVISION" --region "$REGION" --format=json 2>/dev/null \
              | jq -r '[.status.conditions[]? | select(.type == "Ready") | .status][0] // "Unknown"')
            echo "  revision condition: $CONDITION (check $i/12)"
            if [ "$CONDITION" = "True" ]; then
              echo "Revision is ready!"
              break
            fi
            if [ "$CONDITION" = "False" ]; then
              echo "::error::Revision $REVISION is not ready. Conditions:"
              gcloud run revisions describe "$REVISION" --region "$REGION" --format='yaml(status.conditions)'
              exit 1
            fi
            sleep 10
          done

          if [ "$CONDITION" != "True" ]; then
            echo "::error::Could not confirm revision $REVISION readiness after 12 checks"
            gcloud run revisions describe "$REVISION" --region "$REGION" --format='yaml(status.conditions)' || true
            exit 1
          fi

          # ─── สร้าง Identity Token (WIF ต้อง impersonate SA) ──────
          TOKEN=$(gcloud auth print-identity-token \
            --impersonate-service-account="${{ vars.DEPLOYER_SA }}" \
            --audiences="$SERVICE_URL" \
            --include-email 2>/dev/null) || true

          if [ -n "$TOKEN" ]; then
            echo "Identity token acquired (via SA impersonation)"
            AUTH_ARGS=(-H "Authorization: Bearer $TOKEN")
          else
            echo "::warning::Could not mint identity token – trying without auth (service must be public)"
            AUTH_ARGS=()
          fi

          # ─── Probe /healthz ──────────────────────────────────────
          echo "Waiting 30s for Cloud Run tag routing to propagate across Google Front End..."
          sleep 30
          for i in $(seq 1 20); do
            echo "Attempt $i/20: probing ${TAG_URL}/healthz"
            HTTP_CODE=$(curl -s -o /tmp/smoke_body.txt -w "%{http_code}" \
              --max-time 10 \
              "${AUTH_ARGS[@]}" \
              "${TAG_URL}/healthz")
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Smoke test passed! (HTTP $HTTP_CODE)"
              cat /tmp/smoke_body.txt
              exit 0
            fi
            echo "::warning::HTTP $HTTP_CODE - Response body:"
            cat /tmp/smoke_body.txt
            echo ""
            sleep 10
          done
          echo "::error::Smoke test failed after 20 attempts - traffic stays on the previous revision"
          exit 1

      - name: Shift traffic to new revision
        env:
          PERCENT: ${{ inputs.traffic_percent || '100' }}
        run: |
          case "$PERCENT" in ''|*[!0-9]*) echo "::error::traffic_percent must be 1-100"; exit 1 ;; esac
          if [ "$PERCENT" -lt 1 ] || [ "$PERCENT" -gt 100 ]; then
            echo "::error::traffic_percent must be 1-100"; exit 1
          fi
          gcloud run services update-traffic "$SERVICE" \
            --to-revisions "${{ steps.deploy.outputs.revision }}=$PERCENT"

      - name: Remove deployment tag
        if: always() && steps.deploy.outputs.tag != ''
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --remove-tags "${{ steps.deploy.outputs.tag }}" || true

      - name: Summary
        run: |
          {
            echo "### Deployed ${{ steps.deploy.outputs.revision }}"
            echo "- Image: \`$IMAGE\`"
            echo "- URL: ${{ steps.deploy.outputs.service_url }}"
            echo "- Rollback: \`gcloud run services update-traffic $SERVICE --region $REGION --to-revisions=<previous-revision>=100\`"
          } >> "$GITHUB_STEP_SUMMARY"
